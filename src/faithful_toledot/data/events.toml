notes = "INFERRED, not stated by Microsoft. Pattern: %%(2048+i) = SAM flag i cleared, %%(2080+i) = SAM flag i set, where i is the bit index in the MS-SAMR USER_ACCOUNT layout (i = 0 is 0x1). Checked against every sample on the 4720, 4738, 4741 and 4742 pages (%%2080 %%2082 %%2084 with NewUacValue 0x15; %%2050 %%2089 with 0x15 -> 0x211; %%2087 with 0x80; %%2093 with 0x80 -> 0x2080): all seven codes agree. Do not trust it for bit indexes not exercised by those samples (0, 2, 4, 7, 9, 13). Prefer decoding OldUacValue/NewUacValue and diffing them."

