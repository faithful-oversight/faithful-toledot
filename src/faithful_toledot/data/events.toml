[meta]
schema = 1
note = "Field names are the EventData (or UserData) element names. Order matters: JSON exports lose names and are mapped by position."

[[event]]
id = 4720
channel = "Security"
provider = "Microsoft-Windows-Security-Auditing"
title = "User account created"
category = "user"
action = "created"
source = "https://learn.microsoft.com/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4720"
confirmed = true
labels_complete = false
notes = "Sample XML in the page is the field source. The page's descriptions list 'Home Drive' but the XML carries HomePath, and the XML has an UserAccountControl element the descriptions do not cover; HomePath and UserAccountControl have no label here for that reason. For a new account OldUacValue is documented as 0x0. PasswordLastSet/AccountExpires typically render as <never> and LogonHours as <value not set> (shown as %%1794 and %%1793 in the sample XML)."

