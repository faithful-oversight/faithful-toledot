#
# The Vale style packages the docs check uses, each pinned to one release and
# the SHA-256 of its zip. scripts/install_vale_styles.sh installs exactly these;
# `vale sync` is not used, because it fetches the newest release of each package
# with no checksum.
#
# Format: <name> <url> <sha256>
# To update, download the new release zip, run `sha256sum` on it, change the
# version in the URL and the digest here in one pull request, and run
# `scripts/check.sh docs`.
