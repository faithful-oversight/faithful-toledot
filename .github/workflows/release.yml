name: Release

# Run manually from the Actions tab on main. See docs/releasing.md.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  preflight:
    name: Preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read # confirm CI passed on the release commit
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check version, changelog, and tag
        id: check
        run: |
          version="$(uv run --no-project python scripts/release_preflight.py "$RUNNER_TEMP/notes.md")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Require a passing CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # 15368 is the GitHub Actions app, so a check from another app cannot satisfy this.
          query="check_name=All%20checks%20passed&filter=latest&app_id=15368"
          conclusion="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?${query}" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "$conclusion" = "0" ]; then
            echo "::error::CI has not passed on ${SHA}"
            exit 1
          fi

  checks:
    name: Full check suite
    needs: preflight
    permissions:
      contents: read
      pull-requests: read # needed by the reused CI workflow's pull request job
    uses: ./.github/workflows/ci.yml

  build:
    name: Build artifacts
    needs: [preflight, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: Build, write release notes, and record checksums
        run: |
          uv run --no-sync python scripts/release_preflight.py dist-notes.md >/dev/null
          uv build
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt > runtime-requirements.txt
          uv run --no-sync cyclonedx-py requirements runtime-requirements.txt \
            --pyproject pyproject.toml --mc-type application \
            --output-format JSON --output-file dist/sbom.cdx.json
          (cd dist && sha256sum -- * > SHA256SUMS)
          mv dist-notes.md release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [preflight, build]
    if: vars.FO_PUBLIC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/faithful-toledot/${{ needs.preflight.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Keep only Python distributions
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Lets a release that failed after this step be run again.
          skip-existing: true

  github-release:
    name: Tag and publish GitHub release
    needs: [preflight, build, pypi]
    # Runs after PyPI publishing, or when publishing is skipped because the
    # repository is still private.
    if: >-
      always() && needs.build.result == 'success'
      && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # sign build provenance attestations
      attestations: write # store build provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Attest build provenance
        # Attestations for private repositories need GitHub Enterprise Cloud.
        if: vars.FO_PUBLIC == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; nothing to do."
            exit 0
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "$REPO" --target "$SHA" \
            --title "v${VERSION}" --notes-file release-notes.md --verify-tag=false
