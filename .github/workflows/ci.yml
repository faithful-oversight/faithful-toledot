name: CI

on:
  pull_request:
    # "edited" is not a default type. Without it, a changed title keeps its old
    # check result, and the title becomes the squash commit message.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:
  schedule:
    # Weekly, to catch newly published vulnerabilities and broken links.
    - cron: "17 9 * * 1"
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  # The one pinned uv release for this workflow. setup-uv checks its checksum.
  # Change it with every workflow and docs/releasing.md in the same pull request.
  FO_UV_VERSION: "0.11.32"

jobs:
  static:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.FO_UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: scripts/check.sh format lint types

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Actions minutes are free on public repositories and metered on private
        # ones. A pull request in a private repository tests the oldest and newest
        # supported Python; every other run tests all four.
        python: >-
          ${{ fromJSON(
            github.event.repository.private
            && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
            && '["3.11", "3.14"]'
            || '["3.11", "3.12", "3.13", "3.14"]'
          ) }}
        # Windows on every run. macOS minutes cost ten times Linux minutes on
        # private repositories, so macOS never runs on pull requests, and on a
        # private repository it runs only on schedule and before releases
        # (Release calls this workflow by workflow_dispatch). A public repository
        # also runs macOS on every push to main.
        include: >-
          ${{ fromJSON(
            (github.event_name == 'pull_request' || github.event_name == 'merge_group'
              || (github.event.repository.private && github.event_name == 'push'))
            && '[{"os": "windows-latest", "python": "3.13"}]'
            || '[{"os": "windows-latest", "python": "3.13"}, {"os": "macos-latest", "python": "3.13"}]'
          ) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.FO_UV_VERSION }}
          enable-cache: false
          python-version: ${{ matrix.python }}
      # The live extra lets the real pypsrp transport tests run. GitHub's runners
      # include pwsh, so the collector's PowerShell tests run too. The two REQUIRE
      # variables make those tests fail rather than skip if either is missing.
      - run: uv sync --locked --extra live
      - run: scripts/check.sh test
        env:
          TOLEDOT_REQUIRE_LIVE: "1"
          TOLEDOT_REQUIRE_PWSH: "1"
      # The script supports Windows PowerShell 5.1 as well as PowerShell 7, and every
      # Windows runner has 5.1, so its tests run under 5.1 too. Coverage is measured
      # by the full run above.
      - name: Test the PowerShell script under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()"
          uv run --locked --no-sync pytest --no-cov tests/test_powershell.py
        env:
          TOLEDOT_PWSH: powershell
          TOLEDOT_REQUIRE_PWSH: "1"

  docs:
    name: Docs, config, and workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.FO_UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: scripts/check.sh docs site config reuse
        env:
          TOLEDOT_REQUIRE_PWSH: "1"
      - run: scripts/check.sh workflows
        env:
          # Only zizmor sees the token. It lets zizmor run its online audits,
          # such as checks for known-vulnerable actions.
          GH_TOKEN: ${{ github.token }}

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local links
        if: github.event_name != 'schedule'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --offline './**/*.md'
          fail: true
      - name: Check all links, including external ones
        if: github.event_name == 'schedule'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true

  security:
    name: Secrets, vulnerabilities, and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.FO_UV_VERSION }}
          enable-cache: false
      - run: |
          scripts/install_gitleaks.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: scripts/check.sh secrets deps licenses

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.FO_UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: scripts/check.sh build

  pull-request:
    name: Pull request title and sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # read the pull request title
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            revert
            security
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Developer Certificate of Origin sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Dependabot commits are exempt only on a pull request Dependabot opened.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: scripts/check_dco.sh "$BASE_SHA" "$HEAD_SHA"

  dependency-review:
    name: Dependency review
    # Needs GitHub code security features, which are free once the repository is
    # public. The condition reads the repository's real visibility, not the
    # FO_PUBLIC variable, so a wrong variable cannot switch the review off.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # Keep in sync with ALLOWED in scripts/check_licenses.py.
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT,
            MIT-0, MPL-2.0, PSF-2.0, Python-2.0, Unlicense, Zlib

  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [static, test, docs, links, security, build, pull-request, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require success from every job; allow only intended skips
        # Every job in scripts/check_needs.py must be present and succeed. Only
        # pull-request (pull requests only) and dependency-review (pull requests in
        # a public repository) may be skipped, and only on the events that skip them.
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: python3 scripts/check_needs.py
