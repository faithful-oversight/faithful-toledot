name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Never paste real exports, logs, account names, or hostnames.
        For security problems, follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `toledot --version`.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands and synthetic input that reproduce the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: This report contains no real organization's data.
          required: true
