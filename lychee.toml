# Link checking for documentation. CI runs lychee on every pull request
# (local links only) and weekly (all links).
accept = ["200..=299", "429"]
exclude_path = ["\\.venv", "LICENSES", "^LICENSE$"]
exclude = [
  # Private until public release.
  "^https://github\\.com/faithful-oversight/",
  "^mailto:",
]
max_retries = 3
timeout = 20
